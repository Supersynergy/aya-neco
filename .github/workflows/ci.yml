name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install
      - name: Check
        run: |
          bun run check
          test -d apps/api/src
          test -d packages/domain/src
          test -f packages/once-woda/module.manifest.json
