<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="AYA-NECO full-stack architecture diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#edf6ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#28251f" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1280" height="640" rx="18" fill="url(#bg)"/>
  <text x="64" y="70" font-family="Avenir Next, Segoe UI, sans-serif" font-size="30" font-weight="900" fill="#111412">AYA-NECO architecture</text>
  <text x="64" y="104" font-family="Avenir Next, Segoe UI, sans-serif" font-size="17" fill="#667064">React is only the workbench; API, domain rules, and SQLite own the truth.</text>

  <g font-family="Avenir Next, Segoe UI, sans-serif" font-size="18" font-weight="800">
    <g transform="translate(48 170)" filter="url(#shadow)">
      <rect width="168" height="96" rx="10" fill="#111412"/>
      <text x="84" y="45" text-anchor="middle" fill="#fffdf8">Human</text>
      <text x="84" y="70" text-anchor="middle" font-size="13" fill="#d9efe5">contribution</text>
    </g>
    <g transform="translate(260 170)" filter="url(#shadow)">
      <rect width="168" height="96" rx="10" fill="#d9efe5" stroke="#19705a"/>
      <text x="84" y="45" text-anchor="middle" fill="#19705a">React UI</text>
      <text x="84" y="70" text-anchor="middle" font-size="13" fill="#485045">workbench</text>
    </g>
    <g transform="translate(472 170)" filter="url(#shadow)">
      <rect width="168" height="96" rx="10" fill="#f2e6cb" stroke="#9b6b1d"/>
      <text x="84" y="38" text-anchor="middle" fill="#9b6b1d">Bun API</text>
      <text x="84" y="64" text-anchor="middle" font-size="13" fill="#485045">HTTP routes</text>
    </g>
    <g transform="translate(684 170)" filter="url(#shadow)">
      <rect width="168" height="96" rx="10" fill="#fffdf8" stroke="#d9d3c8"/>
      <text x="84" y="38" text-anchor="middle" fill="#111412">Domain</text>
      <text x="84" y="64" text-anchor="middle" font-size="13" fill="#485045">rules + hashes</text>
    </g>
    <g transform="translate(896 170)" filter="url(#shadow)">
      <rect width="168" height="96" rx="10" fill="#d9e9f1" stroke="#205c7a"/>
      <text x="84" y="38" text-anchor="middle" fill="#205c7a">SQLite</text>
      <text x="84" y="64" text-anchor="middle" font-size="13" fill="#485045">event store</text>
    </g>
    <g transform="translate(1108 170)" filter="url(#shadow)">
      <rect width="124" height="96" rx="10" fill="#fffdf8" stroke="#d9d3c8"/>
      <text x="62" y="38" text-anchor="middle" fill="#111412">Receipt</text>
      <text x="62" y="64" text-anchor="middle" font-size="13" fill="#485045">export</text>
    </g>
  </g>

  <g stroke="#19705a" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M222 218h30"/>
    <path d="M434 218h30"/>
    <path d="M646 218h30"/>
    <path d="M858 218h30"/>
    <path d="M1070 218h30"/>
  </g>
  <g fill="#19705a">
    <path d="M252 218l-12-7v14z"/>
    <path d="M464 218l-12-7v14z"/>
    <path d="M676 218l-12-7v14z"/>
    <path d="M888 218l-12-7v14z"/>
    <path d="M1100 218l-12-7v14z"/>
  </g>

  <g transform="translate(112 390)" font-family="Avenir Next, Segoe UI, sans-serif" filter="url(#shadow)">
    <rect width="260" height="94" rx="10" fill="#111412"/>
    <text x="130" y="38" text-anchor="middle" font-size="18" font-weight="900" fill="#fffdf8">API contract</text>
    <text x="130" y="64" text-anchor="middle" font-size="13" fill="#d9efe5">/state, /receipt, /woda</text>
  </g>
  <g transform="translate(510 390)" font-family="Avenir Next, Segoe UI, sans-serif" filter="url(#shadow)">
    <rect width="260" height="94" rx="10" fill="#111412"/>
    <text x="130" y="38" text-anchor="middle" font-size="18" font-weight="900" fill="#fffdf8">ONCE/WODA</text>
    <text x="130" y="64" text-anchor="middle" font-size="13" fill="#d9efe5">module envelope</text>
  </g>
  <g transform="translate(908 390)" font-family="Avenir Next, Segoe UI, sans-serif" filter="url(#shadow)">
    <rect width="260" height="94" rx="10" fill="#111412"/>
    <text x="130" y="38" text-anchor="middle" font-size="18" font-weight="900" fill="#fffdf8">IOTA</text>
    <text x="130" y="64" text-anchor="middle" font-size="13" fill="#d9efe5">hash notarization slot</text>
  </g>
  <g stroke="#205c7a" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round" fill="none">
    <path d="M556 266C480 334 346 350 242 390"/>
    <path d="M1170 266C1064 344 806 356 640 390"/>
    <path d="M1170 266C1118 338 1050 356 1038 390"/>
  </g>

  <g font-family="Avenir Next, Segoe UI, sans-serif" fill="#485045">
    <text x="64" y="564" font-size="15" font-weight="800">Truth boundary:</text>
    <text x="188" y="564" font-size="15">the backend appends events, SQLite persists them, and exports are derived from replayed events.</text>
  </g>
</svg>
