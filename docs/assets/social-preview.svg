<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="AYA-NECO proof economy lab social preview">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="0.55" stop-color="#edf6ef"/>
      <stop offset="1" stop-color="#d9e9f1"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111412"/>
      <stop offset="1" stop-color="#19705a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#111412" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#28251f" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="#f6f4ef"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect x="48" y="48" width="1184" height="544" rx="18" fill="url(#paper)" stroke="#d9d3c8" filter="url(#soft)"/>

  <g transform="translate(86 86)">
    <rect width="56" height="56" rx="12" fill="#111412"/>
    <path d="M17 25c5-8 17-8 22 0M20 31c4-4 12-4 16 0M24 38h8" fill="none" stroke="#fffdf8" stroke-width="3" stroke-linecap="round"/>
    <text x="74" y="24" font-family="Avenir Next, Segoe UI, sans-serif" font-size="28" font-weight="800" fill="#111412">AYA-NECO</text>
    <text x="74" y="52" font-family="Avenir Next, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#667064">Proof economy lab</text>
  </g>

  <g transform="translate(86 180)">
