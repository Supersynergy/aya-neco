    <text x="0" y="240" font-family="Iowan Old Style, Georgia, serif" font-size="88" font-weight="700" fill="#111412">One value loop.</text>
    <text x="4" y="296" font-family="Avenir Next, Segoe UI, sans-serif" font-size="24" font-weight="500" fill="#485045">Gradido-style rewards + Planedo-style impact + IOTA-ready proofs + ONCE/WODA modules.</text>
  </g>

  <g transform="translate(786 150)">
    <circle cx="170" cy="170" r="136" fill="#fffdf8" stroke="#d9d3c8" stroke-width="2"/>
    <circle cx="170" cy="170" r="82" fill="#111412"/>
    <text x="170" y="160" text-anchor="middle" font-family="Avenir Next, Segoe UI, sans-serif" font-size="18" font-weight="900" fill="#fffdf8">RECEIPT</text>
    <text x="170" y="188" text-anchor="middle" font-family="Avenir Next, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#d9efe5">HASH CHAIN</text>
    <g fill="#19705a" font-family="Avenir Next, Segoe UI, sans-serif" font-size="14" font-weight="900">
      <circle cx="170" cy="12" r="28" fill="#d9efe5" stroke="#19705a"/>
      <text x="170" y="17" text-anchor="middle">ID</text>
      <circle cx="326" cy="170" r="28" fill="#d9e9f1" stroke="#205c7a"/>
      <text x="326" y="175" text-anchor="middle" fill="#205c7a">IOTA</text>
      <circle cx="170" cy="328" r="28" fill="#f2e6cb" stroke="#9b6b1d"/>
      <text x="170" y="333" text-anchor="middle" fill="#9b6b1d">GDD</text>
      <circle cx="12" cy="170" r="28" fill="#d9efe5" stroke="#19705a"/>
      <text x="12" y="175" text-anchor="middle">CO2e</text>
      <circle cx="58" cy="58" r="26" fill="#fffdf8" stroke="#111412"/>
      <text x="58" y="63" text-anchor="middle" fill="#111412">WODA</text>
      <circle cx="282" cy="282" r="26" fill="#fffdf8" stroke="#111412"/>
      <text x="282" y="287" text-anchor="middle" fill="#111412">ONCE</text>
    </g>
    <g stroke="#19705a" stroke-width="4" stroke-linecap="round" opacity="0.65">
      <path d="M170 42V88"/>
      <path d="M298 170H252"/>
      <path d="M170 298v-46"/>
      <path d="M42 170h46"/>
      <path d="M78 78l54 54"/>
      <path d="M262 262l-54-54"/>
